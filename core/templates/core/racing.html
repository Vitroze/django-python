{% extends "core/base.html" %}

{% block content %}
<p>Welcome on the Racing page</p>

<ul>
{% for course in courses %}
    <li>{{ course }}</li>
    <img src="{{ course.image }}" alt="{{ course.name }}" width="512">
    <a href="/racing/{{ course.id }}">Voir la course</a>
{% endfor %}
</ul>

{% endblock %}
